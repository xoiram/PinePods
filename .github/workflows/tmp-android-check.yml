# Temporary: debug APK build for Renovate PR #28. Removed before merge.
name: tmp android check
on:
  pull_request:
    paths: ["mobile/android/**", ".github/workflows/tmp-android-check.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: "stable"
      - name: flutter build apk --debug
        working-directory: mobile
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          flutter pub get
          flutter build apk --debug
