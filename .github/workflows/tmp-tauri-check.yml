# Temporary: checks the Tauri crate builds for Renovate PR #23. Removed before merge.
name: tmp tauri check
on:
  pull_request:
    paths: ["web/src-tauri/**", ".github/workflows/tmp-tauri-check.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Depends install
        run: |
          sudo apt update
          sudo apt-get install -qy libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      - name: cargo build
        working-directory: web/src-tauri
        run: |
          mkdir -p ../dist && echo '<html></html>' > ../dist/index.html
          cargo build --locked
